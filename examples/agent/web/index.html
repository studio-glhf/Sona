<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>Sona portable agent</title
  ><link rel="stylesheet" href="/style.css" />
  <main>
    <h1 id="name">Voice agent</h1>
    <p>
      OpenAI processes microphone audio. Selected external services receive tool
      requests. Raw audio and transcripts are not saved. A redacted action
      journal supports recovery.
    </p>
    <label
      ><input id="consent" type="checkbox" />I accept this processing
      notice.</label
    >
    <div id="connections"></div>
    <div class="orb" aria-hidden="true"></div>
    <h2 id="status" role="status">Ready</h2>
    <div>
      <button id="start">Start</button><button id="mute" disabled>Mute</button
      ><button id="end" disabled>End session</button
      ><button id="resume">Resume audio</button>
    </div>
    <div id="turn-controls"></div>
    <p id="error" role="alert"></p>
  </main>
  <script src="/runtime.js" type="module"></script>
</html>
